<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库管理</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><p class="eyebrow">CONTRACT KNOWLEDGE BASE</p><h1>知识库管理</h1></div><a class="secondary" href="/">返回审查</a></header>
<main><section class="panel"><h2>导入资料</h2><p class="hint">支持文本型 PDF、DOCX、TXT，单个文件最大 10MB；扫描件暂不支持 OCR。导入后会提取文本写入本地知识库。</p><form id="upload-source-form" class="source-form"><label>资料文件<input name="file" type="file" accept=".pdf,.docx,.txt" required></label><label>资料名称<input name="title" required></label><label>法域<select name="jurisdiction"><option value="CN">CN</option><option value="JP">JP</option><option value="CN-JP">CN-JP</option></select></label><label>文件类型<input name="document_type" value="uploaded"></label><label>官方来源链接（可选）<input name="source_url" type="url"></label><label>效力日期（可选）<input name="effective_date" type="date"></label><button>导入资料</button></form><p id="upload-status"></p></section><section class="panel knowledge"><div class="section-heading"><h2>本地资料</h2><button id="rebuild" class="secondary">重建知识库</button></div><p id="knowledge-status">读取中...</p><p class="hint">启用或停用资料后，重建知识库使新的配置生效。资料较长时仅显示前两句，可下载全文。</p><div id="knowledge-sources" class="knowledge-sources"></div></section></main><script src="/static/knowledge.js"></script></body></html>
