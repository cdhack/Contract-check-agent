<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contract Check Agent</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><p class="eyebrow">CN / JP CONTRACT REVIEW</p><h1>合同审查工作台</h1></div><button id="settings-toggle" class="secondary">LLM 设置</button></header>
<main><section class="panel hero"><h2>上传合同，获得可追溯的双语审查</h2><p>文本型 PDF、DOCX 或 TXT，最大 10MB。结果仅作初步审查与人工复核辅助。</p><form id="review-form"><label class="file"><input type="file" name="file" accept=".pdf,.docx,.txt" required><span>选择合同文件</span></label><label>审查法域 <select name="jurisdiction"><option>Auto</option><option>CN</option><option>JP</option><option>CN-JP</option></select></label><button id="review-submit">开始审查</button></form><p id="status"></p></section>
<section id="settings" class="panel hidden"><h2>LLM 连接设置</h2><div class="grid"><label>Provider<select id="provider"><option value="deepseek">DeepSeek</option><option value="openrouter">OpenRouter</option><option value="custom">Custom</option></select></label><label>Base URL<input id="base_url"></label><label>Model<input id="model"></label><label>API Key<input id="api_key" type="password" placeholder="保持现有密钥请留空"></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step="0.1"></label></div><button id="save-settings">保存设置</button> <button id="test-settings" class="secondary">测试连接</button><span id="setting-status"></span></section>
<section class="panel knowledge"><div class="section-heading"><h2>本地知识库</h2><a class="secondary" href="/knowledge">管理知识库</a></div><p id="knowledge-status">读取中...</p></section>
<section class="panel"><div class="section-heading"><h2>审查历史</h2><button id="refresh-history" class="secondary">刷新记录</button></div><p id="history-empty" class="hint hidden">暂无审查记录。</p><div id="history-list" class="history-list"></div></section>
<section id="results" class="hidden"><div class="downloads"><a id="download-md">下载 Markdown</a><a id="download-json">下载 JSON</a></div><div class="result-grid"><section class="panel"><h2>合同正文</h2><pre id="contract-text"></pre></section><section class="panel"><h2>结构化信息</h2><pre id="facts"></pre><h2>双语对比</h2><div id="comparison"></div></section></div><section class="panel"><h2>Agent 检索记录</h2><div id="tool-calls"></div></section><section class="panel"><h2>审查报告</h2><div id="report"></div></section></section></main><button id="verify-open" class="verify-fab">一键核实</button><section id="verify-modal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-labelledby="verify-title"><div class="verify-dialog"><div class="verify-header"><div><p class="eyebrow">QUICK CHECK</p><h2 id="verify-title">一键核实</h2></div><button id="verify-close" class="verify-close" aria-label="关闭">×</button></div><p class="hint">输入条款、事实或需要确认的问题，无需先上传合同。</p><textarea id="verify-prompt" rows="6" placeholder="例如：核实这段中日文付款条款是否存在不一致，并列出需要确认的事项。"></textarea><div class="verify-actions"><button id="verify-submit">一键核实</button></div><div id="verify-answer" class="verify-answer hidden"></div></div></section><script src="/static/app.js"></script></body></html>
