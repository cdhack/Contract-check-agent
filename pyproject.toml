[project]
name = "contract-check-agent"
version = "0.5.6"
description = "Bilingual CN-JP contract review assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1",
  "pydantic>=2.8", "pydantic-settings>=2.4", "python-multipart>=0.0.9",
  "pymupdf>=1.24", "python-docx>=1.1", "openai>=1.40",
  "qdrant-client[fastembed]>=1.10", "fastembed>=0.3", "pyyaml>=6.0",
  "markdown>=3.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
